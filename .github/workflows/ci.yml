name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "proto/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "proto/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      # 生成代码不入库（*.g.dart / *.freezed.dart 被 ignore），每次必须重建
      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      # 基线本身带 143 条历史 issue，这里只拦"新增 error"，不拦存量
      - name: Analyze (fail on new errors only)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          cat analyze.log
          BASE_ERRS="lib/app/extensions/provider.dart"
          BASE_WARNS="lib/api/file/providers/file_setting.dart"
          new_err=$(grep -E "error •" analyze.log | grep -vE "$BASE_ERRS" | wc -l | tr -d ' ')
          new_warn=$(grep -E "warning •" analyze.log | grep -vE "$BASE_WARNS" | wc -l | tr -d ' ')
          echo "new errors: $new_err / new warnings: $new_warn"
          if [ "$new_err" != "0" ]; then
            echo "::error::$new_err new analyzer error(s)"
            exit 1
          fi

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib
        continue-on-error: true
