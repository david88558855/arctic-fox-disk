name: build-apk

# 本机无 Flutter SDK，真机编译只在这里做。
# 手动触发：gh workflow run build-apk
on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"
  GO_VERSION: "1.23"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/app/libs/libserver.aar 由 Go server 用 gomobile 绑定生成，
      # 仓库里不带这个产物，必须先编译，否则 gradle 报 Could not find :libserver
      - name: Build Go aar
        working-directory: .
        run: |
          mkdir -p app/android/app/libs
          cd server
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          gomobile bind \
            -ldflags="-w -s -X github.com/honmaple/maple-file/server/internal/app.VERSION=dev" \
            -o ../app/android/app/libs/libserver.aar \
            -target=android -androidapi 21 \
            -javapkg="com.honmaple.maple_file" \
            github.com/honmaple/maple-file/server/cmd/mobile

      - name: Pub get
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
