syntax = "proto3";

package api.base;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "api/base";

service SettingService {
	rpc ResetSetting (Setting.ResetRequest) returns (Setting.ResetResponse) {
		option (google.api.http) = {
			post: "/api/settings/reset"
		};
	}
	rpc UpdateSetting (Setting.UpdateRequest) returns (Setting.UpdateResponse) {
		option (google.api.http) = {
			post: "/api/settings"
			body: "*"
		};
	}
	rpc GetSetting (Setting.GetRequest) returns (Setting.GetResponse) {
		option (google.api.http) = {
			get: "/api/setting/{key}"
		};
	}
}

message Setting {
	// @gotags: gorm:"primary_key;auto_increment"
	int32 id = 1;
	// @gotags: gorm:"serializer:protobuf_timestamp;type:datetime"
	google.protobuf.Timestamp created_at = 2;
	// @gotags: gorm:"serializer:protobuf_timestamp;type:datetime"
	google.protobuf.Timestamp updated_at = 3;

	// @gotags: gorm:"size:128;not null;unique"
	string key = 4;
	string value = 5;

	message GetRequest {
		string key = 1;
	}

	message GetResponse {
		Setting result = 1;
	}

	message UpdateRequest {
		string key = 1;
		string value = 2;
	}

	message UpdateResponse {
		Setting result = 1;
	}

	message ResetRequest {
		string key = 1;
	}

	message ResetResponse {
	}
}
